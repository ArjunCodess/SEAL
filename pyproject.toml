[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "supervisor-evidence-arms"
version = "0.1.0"
description = "SEAL (Supervisor Evidence Arms, Live): recorded evaluation of model advice and enforced publication on fixed local fixtures"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Arjun Vijay Prakash"}]
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "build>=1.2"]
context = ["transformers==5.19.0", "tokenizers==0.23.1"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools]
packages = ["src", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
